schema: "aristo_joint_space_control/v1"

robot_model:
  urdf_path: "package://plato_description/urdf/generated/aristo.urdf"
  is_floating_base: false
  base_frame: "base_link"
  fixed_thumb: true  # Overrides all joint 0 and joint 1 commands to zero.

controller:
  dt: 0.01
  command_type: "joint_impedance"
  num_joints: 8

driver_gains:
  # Driver-local impedance gains copied into RobotCommand.kp / RobotCommand.kd.
  # These are sent to the embedded driver and are separate from host-side task gains.
  # Limit enforcement is handled by the actuator/hardware layer.
  #
  # RobotCommand uses SI units inside plato_robot_system:
  #   kp: Nm/rad
  #   kd: Nm/(rad/s)
  kp: [0.0, 0.0, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05]
  kd: [0.0, 0.0, 0.001, 0.001, 0.001, 0.001, 0.001, 0.001]

state_machine:
  states:
    - id: 0
      name: initialize
      duration: 2.0
      stay_here: true
      params:
        target_jpos: 0.0
        kp_task: 0.0
        kd_task: 0.0

    - id: 1
      name: idle
      stay_here: true

    - id: 2
      name: joint_teleop
      stay_here: true
      params:
        # Float64MultiArray target joint positions are smoothed with a first-order LPF.
        # 0 freezes the command, and 1 applies the target immediately.
        lpf_alpha: 0.1

        # Host-side task feedback gains for tau_cmd only. Driver-local gains
        # still come from driver_gains.kp/kd during command finalization.
        kp_task: 0.0
        kd_task: 0.0

    - id: 3
      name: grasp_teleop
      stay_here: true
      params:
        # Teleop input is [u_close, u_lateral] or [u_close, u_lateral, f]:
        #   u_close   = 0 closed, 1 open
        #   u_lateral = 0.5 centered contact points, 0/1 lateral offsets
        #   f         = optional desired normal force override [N]
        #
        # If f is omitted, plato_ros_controller uses the external
        # /grasp_force_reference target while reference_valid is true and falls
        # back to this default force otherwise.
        default_u_close: 0.8
        default_u_lateral: 0.5
        default_desired_force_n: 1.0

        grasp_task:
          # Core experiment knobs only. Less-frequently changed QP weights,
          # contact policy, safety rates, QP damping, and geometry behavior use
          # plato_robot_system::task::GraspTaskConfig header defaults.
          distance_closed_m: 0.015
          distance_open_m: 0.085
          lateral_offset_limit_m: 0.02

          force_exit_u_threshold: 0.75

          q_posture: [0.0, 0.0, 0.0, 0.0]
          fallback_close_axis_base: [0.0, 0.0, -1.0]

          kp_lateral: 20.0
          kd_lateral: 2.0
          kp_tactile_fb: 0.02
          w_lateral: 5.0

          # Conservative first hardware bring-up limits.
          max_qddot_rad_s2: 5.0
          max_velocity_rad_s: 0.5
          max_torque_nm: 0.05

    - id: 4
      name: mppi_grasp
      stay_here: true

debug:
  enabled: false
  print_interval: 5.0
