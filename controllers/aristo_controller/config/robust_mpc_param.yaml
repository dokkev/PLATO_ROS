# Aristo robust grasp MPC hardware parameters.
# Active path: continuous qddot MPPI with real tactile contacts as anchors.
# Measured tactile force drives preload/balance. Object geometry drives support,
# edge margin, contact loss, and a mild deep-contact guard only.

safety:
  max_reference_tracking_error_rad: 0.25
  max_qdot_cmd_rad_s: 0.5
  max_tau_cmd_nm: 0.05
  max_tau_rate_nm_s: 1.0
  exit_u_threshold: 0.6
  clamp_q_cmd_to_model_limits: true
  exit_on_all_contacts_lost: true
  exit_on_u_above_threshold: true
  rollout_only: false

tactile:
  thumb_normal_axis_sign: 1.0
  index_normal_axis_sign: 1.0

debug:
  print_status: true
  print_status_interval_s: 0.5
  print_action_vectors: true

task:
  object:
    name: jenga_block
    geometry_type: box
    uri: package://mppi_core/object/jenga_block.urdf
    primitive_size_m: [0.15, 0.05, 0.03]
    initial_pose_world:
      xyz: [0.26, 0.04, -0.05]
      rpy: [0.0, 0.0, 0.0]
    initial_pose_uncertainty:
      xyz_std_m: [0.02, 0.01, 0.02]
      rpy_std_rad: [0.1, 0.1, 0.2]

robust_grasp:
  control_mode: continuous_qddot_mppi
  continuous_control_rate_cost_weight: 0.005
  continuous_smoothing_alpha: 0.7
  skip_mppi_when_not_enough_contacts: true
  use_base_grasp_controller: true
  use_rnea_feedforward: true

  base_grasp_controller:
    target_normal_force_n: 2.0
    min_normal_force_per_sensor_n: 0.5
    max_normal_force_per_sensor_n: 30.0
    force_gain: 0.2
    force_balance_gain: 10.0
    contact_loss_gain: 0.2
    high_force_release_gain: 0.2
    max_qddot_base: 2.0
    max_qddot_residual: 0.5
    base_deviation_weight: 0.01
    use_force_balance: true
    use_contact_loss_reflex: true
    use_high_force_guard: true

  rnea:
    use_measured_state: true
    subtract_contact_torque: false
    tau_ff_scale: 0.2
    max_tau_ff_nm: 0.1
    max_tau_ff_rate_nm_s: 1.0
    zero_tau_when_not_ready: true
    zero_tau_on_contact_loss: true
    gravity_only_when_qddot_zero: false

  rollout:
    horizon_steps: 2
    dt: 0.01
    num_rollouts: 32
    num_threads: 4
    temperature: 1.0
    random_seed: 7
    action_lower_bound: -5.0
    action_upper_bound: 5.0
    action_noise_std: 0.25
    action_noise_clip: 1.0
    qdot_limit: 0.5

  disturbance:
    num_disturbance_rollouts: 32
    tactile_sensor_count: 2
    random_seed: 7
    object_motion:
      linear_velocity_std_mps: 0.0
      linear_velocity_max_mps: 0.0
      angular_velocity_std_radps: 0.0
      angular_velocity_max_radps: 0.0
    use_antithetic_samples: true

  start:
    min_enough_contact_sensors: 2
    min_active_hemisphere_total: 2

  cost:
    min_active_tactile_sensors: 1
    min_active_hemisphere_total: 2
    contact_loss_weight: 20.0
    support_weight: 5.0

    target_normal_force_n: 2.0
    min_normal_force_per_sensor_n: 0.5
    max_normal_force_per_sensor_n: 30.0
    force_low_weight: 30.0
    force_high_weight: 0.0
    force_balance_weight: 10.0
    force_balance_deadband_n: 0.05

    qddot_weight: 0.05
    object_support:
      enabled: true
      object_pose_samples: 2
      hemisphere_radius_m: 0.003
      support_distance_scale_m: 0.001
      good_contact_gap_min_m: -0.001
      good_contact_gap_max_m: 0.001
      deep_contact_scale_m: 0.002
      deep_contact_weight: 5.0
      edge_weight: 10.0
      target_edge_margin_m: 0.001
      use_particle_weights: true

  behavior:
    require_both_contact_for_update: true
    return_hold_when_not_ready: true
