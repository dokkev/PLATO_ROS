ft_collision_test_node:
  ros__parameters:
    # Joint movement parameters (joint5 is index 4 in command arrays)
    joint5_velocity: 0.05      # rad/s
    joint5_start: -0.36        # rad
    joint6_start: 0.37         # rad baseline for optional decoupling
    joint5_min: -1.0           # rad
    joint5_max: 1.0            # rad
    decouple_joint6: true      # keep fingertip world pose by compensating joint6

    # Collision detection thresholds
    force_threshold: 0.6       # N
    torque_threshold: 0.02     # Nm
    force_component: norm      # norm | fx | fy | fz
    torque_component: norm     # norm | tx | ty | tz

    # Topics
    ft_topic: /plato2/ft_sensor2/wrench
    joint_state_topic: /plato2/joint_states_smoothed
    impedance_command_topic: /plato2/joint_impedance_controller/commands

    # Control parameters
    control_rate: 100.0        # Hz
    auto_start: false
