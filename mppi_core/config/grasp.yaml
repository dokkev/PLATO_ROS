grasp:
  tactile_transition:
    enable_birth: true
    enable_loss: true
    birth_score_threshold: 0.5
    loss_score_threshold: 0.5
    birth_neighbor_weight: 0.25
    birth_tangent_approach_weight: 1.0
    birth_normal_approach_weight: 0.5
    birth_shear_penalty_weight: 0.5
    loss_unloading_weight: 1.0
    loss_shear_weight: 0.5
    loss_low_force_weight: 0.5
    born_normal_force_n: 0.05
    born_confidence: 0.5
    inactive_confidence: 0.0
    contact_confidence_decay: 1.0
    aggregate_shear_decay: 1.0
    aggregate_rotation_decay: 1.0
    enough_contact_hemisphere_count: 2

  # Contact-force rollout settings are retained for residual/correction
  # experiments. The current GraspStateRolloutModel does not use residual force
  # projection inside MPPI horizon dynamics.
  contact_force_rollout:
    enable_force_projection_update: true
    force_lowpass_alpha: 0.5
    max_predicted_normal_force_n: 20.0
    shear_force_gain_m_per_n_s: 0.0001
    rotational_shear_gain_rad_per_nm_s: 0.01
    friction_violation_confidence_decay: 0.2
    negative_normal_confidence_decay: 0.5
    min_active_hemisphere_count: 4
    min_contact_confidence: 0.001
    shear_ref_m: 0.001
    rotational_shear_ref_rad: 0.02

  normal_force_window:
    min_n: 0.5
    max_n: 2.5
    under_weight: 20.0
    over_weight: 40.0

  slip_risk:
    threshold: 0.25
    weight: 4.0
    # Derived from d(shear_displacement)/dt in the ROS adapter. Keep small
    # until NariTouch units/noise are calibrated on hardware.
    velocity_weight: 0.0

  contact_centroid:
    enabled: true
    boundary_weight: 20.0
    x_min: -0.008
    x_max: 0.008
    y_min: -0.008
    y_max: 0.008

  hemisphere_contact:
    # Prefer a wider local active-hemisphere set when force/slip costs are
    # comparable.
    enabled: true
    target_active_hemisphere_count: 6
    weight: 2.0

  tracking_guard:
    weight: 5.0
    action_scale_weight: 20.0

  action_smoothness:
    weight: 1.0

  joint_limit:
    weight: 10.0
