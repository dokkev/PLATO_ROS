mppi:
  # Rollout horizon in seconds = horizon_steps * dt.
  horizon_steps: 3
  dt: 0.01

  # Sampling budget and MPPI weighting temperature.
  num_rollouts: 128
  temperature: 1.0
  random_seed: 1

  # Action is solver joint acceleration qddot_sol per MPPI step.
  # Units are rad/s^2 for revolute joints and m/s^2 for prismatic joints.
  # Scalars expand to all controlled joints.
  action:
    lower_bound: -20.0
    upper_bound: 20.0
    noise_std: 1.0
    noise_clip: 10.0

  state:
    qdot_limit: 10.0

  # MPPI emits q_cmd, qdot_cmd, and tau_ff/tau_cmd only.
  # Driver-local RobotCommand.kp/kd are copied from driver_gains during command
  # finalization outside the planner.
