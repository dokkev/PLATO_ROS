mppi:
  # Rollout horizon in seconds = horizon_steps * dt.
  horizon_steps: 20
  dt: 0.01

  # Sampling budget and MPPI weighting temperature.
  num_rollouts: 128
  temperature: 1.0
  random_seed: 1

  # Action is solver joint acceleration qddot_sol per MPPI step.
  # Units are rad/s^2 for revolute joints and m/s^2 for prismatic joints.
  # Scalars expand to all controlled joints.
  action:
    lower_bound: -2.0
    upper_bound: 2.0
    noise_std: 0.5

  # Embedded 1 kHz local impedance gains for:
  # tau_driver = tau_cmd + kp * (q_cmd - q_meas) + kd * (qdot_cmd - qdot_meas).
  command:
    kp: 20.0
    kd: 1.0
