task:
  name: grasp_hold

  start:
    min_enough_contact_sensors: 1
    min_active_hemisphere_total: 1

  objective:
    min_active_tactile_sensors: 1
    target_active_hemisphere_total: 4

  tolerance:
    max_shear_m: 0.003
    max_rotation_rad: 0.05

  object:
    name: jenga_block
    geometry_type: box
    uri: package://mppi_core/object/jenga_block.urdf
    primitive_size_m: [0.15, 0.05, 0.03]
    initial_pose_world:
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
    perturbation:
      xyz_std_m: [0.01, 0.01, 0.02]
      rpy_std_rad: [0.1, 0.1, 0.2]

  cost:
    contact_loss_weight: 50.0
    support_weight: 10.0
    shear_weight: 5.0
    rotation_weight: 5.0
    qddot_weight: 1.0
    tau_weight: 0.01
