plato2:
  controller_manager:
    ros__parameters:
      update_rate: 50  # Hz

      plato2_joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster


      plato2_position_controller:
        type: position_controllers/JointGroupPositionController


  plato2_position_controller:
    ros__parameters:
      joints:
        - joint1
        - joint2
        - joint3
        - joint4
        - joint5
        - joint6
        - joint7
        - joint8

      command_interfaces:
        - position

      state_interfaces:
        - position
        - velocity
        - effort