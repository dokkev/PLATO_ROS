plato2:
  controller_manager:
    ros__parameters:
      update_rate: 500  # Hz

      plato2_joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster


      joint_impedance_controller:
        type: joint_impedance_controller/JointImpedanceController


  joint_impedance_controller:
    ros__parameters:
      joints:
        - joint1
        - joint2
        - joint3
        - joint4
        - joint5
        - joint6
        - joint7
        - joint8

      command_interfaces:
        - effort

      state_interfaces:
        - position
        - velocity
        - effort

