plato:
  controller_manager:
    ros__parameters:
      update_rate: 500  # Hz

      plato_joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster


      plato_effort_controller:
        type: effort_controllers/JointGroupEffortController

      plato_joint_controller:
        type: joint_trajectory_controller/JointTrajectoryController


  plato_effort_controller:
    ros__parameters:
      joints:
        - plato_joint0
        - plato_joint1
        - plato_joint2
        - plato_joint3
        - plato_joint4
        - plato_joint5
        - plato_joint6
        - plato_joint7
        - plato_joint8

      command_interfaces:
        - effort

      state_interfaces:
        - position
        - velocity
        - effort

  plato_joint_controller:
    ros__parameters:

      action_monitor_rate: 500.0

      joints:
        - plato_joint0
        - plato_joint1
        - plato_joint2
        - plato_joint3
        - plato_joint4
        - plato_joint5
        - plato_joint6
        - plato_joint7
        - plato_joint8

      command_interfaces:
        - effort
      state_interfaces:
        - position
        - velocity



        


  

    
    

