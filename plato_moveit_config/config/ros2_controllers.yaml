# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    plato_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

plato_hand_controller:
  ros__parameters:
    joints:
      - plato_joint0
      - plato_joint1
      - plato_joint2
      - plato_joint3
      - plato_joint4
      - plato_joint5
      - plato_joint6
      - plato_joint7
      - plato_joint8
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity