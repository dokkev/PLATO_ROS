# Configuration for the slip-aware reference grasp force generator.
#
# This node produces a scalar normal-force reference and diagnostics from two
# tactile sensors. It does not estimate full object state or decide task modes.

reference_grasp_force_generator:
  ros__parameters:
    update_rate: 100.0

    base_force_n: 1.0
    min_contact_force_n: 0.5
    max_force_limit_n: 30.0

    trans_deadband_mm: 0.2
    rot_deadband_rad: 0.03

    translational_slip_threshold_mm: 0.5
    rotational_slip_threshold_rad: 0.05

    k_trans_n_per_mm: 2.0
    d_trans_n_per_mm_s: 0.05

    k_rot_n_per_rad: 10.0
    d_rot_n_per_rad_s: 0.2

    tactile0_shear_x_sign: 1.0
    tactile0_shear_y_sign: 1.0
    tactile0_shear_theta_sign: 1.0
    tactile1_shear_x_sign: 1.0
    tactile1_shear_y_sign: 1.0
    tactile1_shear_theta_sign: 1.0
